<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#9d5b73" />
    <title>美容室・個人整体院 営業ヒアリング | NosTechnology</title>
    <meta
      name="description"
      content="美容室と個人整体院向けの、Webサイト・業務改善・システム開発営業ヒアリングフォーム。スマホ入力、自動保存、回答コピーに対応。"
    />
    <style>
      :root {
        color-scheme: light;
        --accent: #9d5b73;
        --accent-strong: #753d52;
        --accent-soft: #f8edf1;
        --accent-faint: #fdf8fa;
        --ink: #233847;
        --muted: #667680;
        --line: #d7e0e5;
        --surface: #ffffff;
        --background: #f5f7f8;
        --success: #22785d;
        --warning: #8b5d0f;
        --danger: #a33d4d;
        --shadow: 0 18px 50px rgba(34, 55, 68, 0.08);
        font-family:
          "BIZ UDPGothic", "Noto Sans JP", "Yu Gothic", "Meiryo", system-ui, sans-serif;
        font-synthesis: none;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
        background: var(--background);
      }

      body {
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 0 0, color-mix(in srgb, var(--accent-soft) 88%, white), transparent 36rem),
          var(--background);
        min-width: 320px;
      }

      body[data-industry="seitai"] {
        --accent: #3e7a73;
        --accent-strong: #28564f;
        --accent-soft: #eaf4f2;
        --accent-faint: #f7fbfa;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      a {
        color: inherit;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 60px;
        padding: 10px max(18px, env(safe-area-inset-left));
        border-bottom: 1px solid rgba(215, 224, 229, 0.85);
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(18px);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.02em;
      }

      .brand-mark {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 11px;
        color: #fff;
        background: var(--accent);
        box-shadow: 0 8px 18px color-mix(in srgb, var(--accent) 28%, transparent);
      }

      .top-status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .top-status::before {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--success);
        content: "";
        box-shadow: 0 0 0 4px rgba(34, 120, 93, 0.1);
      }

      .shell {
        width: min(100% - 32px, 1080px);
        margin: 0 auto;
        padding: 36px 0 132px;
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(280px, 0.42fr);
        gap: 28px;
        align-items: end;
        margin-bottom: 24px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--accent-strong);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 760px;
        margin: 0;
        font-size: clamp(30px, 5vw, 54px);
        line-height: 1.08;
        letter-spacing: -0.04em;
      }

      .lead {
        max-width: 690px;
        margin: 14px 0 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.8;
      }

      .privacy-note {
        margin: 0;
        padding: 16px 18px;
        border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--line));
        border-radius: 18px;
        background: var(--accent-faint);
        color: var(--accent-strong);
        font-size: 12px;
        font-weight: 700;
        line-height: 1.7;
      }

      .switcher {
        position: sticky;
        top: 70px;
        z-index: 20;
        margin-bottom: 20px;
        padding: 14px;
        border: 1px solid rgba(215, 224, 229, 0.9);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
      }

      .switcher-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .switch-group {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
        padding: 5px;
        border-radius: 15px;
        background: #eef2f4;
      }

      .switch-button {
        min-height: 46px;
        padding: 9px 12px;
        border: 0;
        border-radius: 11px;
        color: var(--muted);
        background: transparent;
        font-size: 13px;
        font-weight: 800;
        transition:
          background 160ms ease,
          color 160ms ease,
          transform 160ms ease;
      }

      .switch-button[aria-selected="true"] {
        color: #fff;
        background: var(--accent);
        box-shadow: 0 8px 18px color-mix(in srgb, var(--accent) 24%, transparent);
      }

      .switch-button:active {
        transform: scale(0.98);
      }

      .progress-row {
        display: grid;
        grid-template-columns: auto minmax(100px, 1fr) auto;
        gap: 12px;
        align-items: center;
        margin-top: 12px;
        padding: 0 4px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .progress-track {
        height: 7px;
        overflow: hidden;
        border-radius: 999px;
        background: #e7ecef;
      }

      .progress-bar {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: var(--accent);
        transition: width 180ms ease;
      }

      .form-intro {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 20px;
        align-items: end;
        margin: 28px 0 16px;
      }

      .form-intro h2 {
        margin: 0;
        font-size: clamp(24px, 4vw, 36px);
        letter-spacing: -0.035em;
      }

      .form-intro p {
        margin: 7px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.7;
      }

      .answered-chip {
        display: inline-flex;
        align-items: center;
        min-height: 38px;
        padding: 8px 13px;
        border-radius: 999px;
        color: var(--accent-strong);
        background: var(--accent-soft);
        font-size: 12px;
        font-weight: 900;
        white-space: nowrap;
      }

      .meta-card,
      .form-section {
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--surface);
        box-shadow: 0 10px 36px rgba(34, 55, 68, 0.045);
      }

      .meta-card {
        margin-bottom: 16px;
        padding: 20px;
      }

      .meta-card h3 {
        margin: 0 0 14px;
        font-size: 15px;
      }

      .field-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .form-section {
        margin: 0 0 16px;
        padding: 0;
        overflow: hidden;
      }

      .section-head {
        display: flex;
        gap: 13px;
        align-items: flex-start;
        padding: 18px 20px;
        border-bottom: 1px solid color-mix(in srgb, var(--accent) 16%, var(--line));
        background: var(--accent-faint);
      }

      .section-no {
        display: grid;
        flex: 0 0 auto;
        width: 32px;
        height: 32px;
        place-items: center;
        border-radius: 10px;
        color: #fff;
        background: var(--accent);
        font-size: 12px;
        font-weight: 900;
      }

      .section-head h3 {
        margin: 0;
        color: var(--accent-strong);
        font-size: 18px;
        line-height: 1.35;
      }

      .section-head p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
      }

      .section-body {
        display: grid;
        gap: 18px;
        padding: 20px;
      }

      .field {
        display: grid;
        gap: 7px;
      }

      .field-label {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
        font-size: 13px;
        font-weight: 800;
        line-height: 1.5;
      }

      .field-label small {
        color: var(--muted);
        font-size: 10px;
        font-weight: 600;
      }

      .field-help {
        margin: -2px 0 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.6;
      }

      input[type="text"],
      input[type="date"],
      textarea,
      select {
        width: 100%;
        min-height: 48px;
        border: 1px solid #cbd6dc;
        border-radius: 13px;
        color: var(--ink);
        background: #fff;
        outline: none;
        transition:
          border-color 150ms ease,
          box-shadow 150ms ease,
          background 150ms ease;
      }

      input[type="text"],
      input[type="date"],
      select {
        padding: 0 13px;
      }

      textarea {
        min-height: 112px;
        resize: vertical;
        padding: 12px 13px;
        line-height: 1.7;
      }

      input:focus,
      textarea:focus,
      select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 14%, transparent);
        background: var(--accent-faint);
      }

      .option-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 9px;
      }

      .option {
        position: relative;
        display: flex;
        min-height: 46px;
        align-items: center;
        gap: 9px;
        padding: 10px 11px;
        border: 1px solid #d3dde2;
        border-radius: 13px;
        background: #fff;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.4;
        transition:
          border-color 150ms ease,
          background 150ms ease,
          color 150ms ease;
      }

      .option:has(input:checked) {
        border-color: var(--accent);
        color: var(--accent-strong);
        background: var(--accent-soft);
      }

      .option input {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
        margin: 0;
        accent-color: var(--accent);
      }

      .actions {
        position: fixed;
        z-index: 40;
        right: max(16px, env(safe-area-inset-right));
        bottom: max(16px, env(safe-area-inset-bottom));
        left: max(16px, env(safe-area-inset-left));
        display: flex;
        width: min(calc(100% - 32px), 720px);
        margin: 0 auto;
        gap: 8px;
        padding: 10px;
        border: 1px solid rgba(215, 224, 229, 0.9);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 18px 60px rgba(34, 55, 68, 0.18);
        backdrop-filter: blur(18px);
      }

      .action-button {
        min-height: 48px;
        flex: 1 1 0;
        padding: 10px 13px;
        border: 1px solid var(--line);
        border-radius: 13px;
        color: var(--ink);
        background: #fff;
        font-size: 12px;
        font-weight: 900;
      }

      .action-button.primary {
        flex: 1.7 1 0;
        border-color: var(--accent);
        color: #fff;
        background: var(--accent);
      }

      .action-button.danger {
        color: var(--danger);
      }

      .toast {
        position: fixed;
        z-index: 50;
        right: 16px;
        bottom: 96px;
        left: 16px;
        width: min(calc(100% - 32px), 480px);
        margin: auto;
        padding: 13px 16px;
        border-radius: 14px;
        color: #fff;
        background: var(--ink);
        box-shadow: 0 15px 40px rgba(34, 55, 68, 0.24);
        font-size: 13px;
        font-weight: 800;
        text-align: center;
        opacity: 0;
        pointer-events: none;
        transform: translateY(8px);
        transition:
          opacity 160ms ease,
          transform 160ms ease;
      }

      .toast.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      .noscript {
        margin: 18px auto;
        padding: 16px;
        border: 1px solid #e2b8bf;
        border-radius: 14px;
        color: #8a3040;
        background: #fff2f4;
      }

      @media (max-width: 760px) {
        .topbar {
          min-height: 56px;
        }

        .top-status {
          font-size: 10px;
        }

        .shell {
          width: min(100% - 22px, 1080px);
          padding-top: 26px;
        }

        .hero {
          grid-template-columns: 1fr;
          gap: 16px;
        }

        .lead {
          font-size: 13px;
        }

        .switcher {
          top: 64px;
          margin-right: -3px;
          margin-left: -3px;
          padding: 9px;
          border-radius: 17px;
        }

        .switcher-grid {
          grid-template-columns: 1fr;
          gap: 7px;
        }

        .switch-button {
          min-height: 42px;
          padding: 7px 8px;
          font-size: 12px;
        }

        .progress-row {
          margin-top: 9px;
        }

        .form-intro {
          grid-template-columns: 1fr;
          gap: 10px;
          margin-top: 22px;
        }

        .answered-chip {
          justify-self: start;
        }

        .field-grid,
        .option-grid {
          grid-template-columns: 1fr;
        }

        .meta-card,
        .form-section {
          border-radius: 18px;
        }

        .meta-card,
        .section-body {
          padding: 16px;
        }

        .section-head {
          padding: 15px 16px;
        }

        .section-head h3 {
          font-size: 16px;
        }

        .actions {
          width: calc(100% - 20px);
          right: max(10px, env(safe-area-inset-right));
          bottom: max(9px, env(safe-area-inset-bottom));
          left: max(10px, env(safe-area-inset-left));
          gap: 6px;
          padding: 7px;
          border-radius: 17px;
        }

        .action-button {
          min-height: 46px;
          padding: 8px 9px;
          font-size: 11px;
        }

        .action-button.download {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body data-industry="beauty">
    <header class="topbar">
      <a class="brand" href="../" aria-label="NosTechnology営業フォーム一覧へ戻る">
        <span class="brand-mark">N</span>
        <span>NosTechnology</span>
      </a>
      <span class="top-status" data-save-status>この端末に自動保存</span>
    </header>

    <main class="shell">
      <section class="hero" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">Sales Hearing Form</p>
          <h1 id="page-title">美容室・個人整体院<br />営業ヒアリング</h1>
          <p class="lead">
            外出先でスマホから入力し、回答をそのまま提案メモへコピーできます。
            業種と相談内容を切り替えてお使いください。
          </p>
        </div>
        <p class="privacy-note">
          入力内容はこの端末内だけに自動保存されます。「回答をコピー」するまで外部送信されません。
          パスワード、決済情報、顧客個人情報は入力しないでください。
        </p>
      </section>

      <section class="switcher" aria-label="ヒアリングシート切り替え">
        <div class="switcher-grid">
          <div class="switch-group" role="tablist" aria-label="業種">
            <button
              class="switch-button"
              type="button"
              role="tab"
              aria-selected="true"
              data-industry-button="beauty"
            >
              美容室・サロン
            </button>
            <button
              class="switch-button"
              type="button"
              role="tab"
              aria-selected="false"
              data-industry-button="seitai"
            >
              個人整体院
            </button>
          </div>
          <div class="switch-group" role="tablist" aria-label="相談内容">
            <button
              class="switch-button"
              type="button"
              role="tab"
              aria-selected="true"
              data-sheet-button="web"
            >
              Webサイト
            </button>
            <button
              class="switch-button"
              type="button"
              role="tab"
              aria-selected="false"
              data-sheet-button="ops"
            >
              業務改善・システム
            </button>
          </div>
        </div>
        <div class="progress-row">
          <span>回答状況</span>
          <div
            class="progress-track"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
            data-progress-track
          >
            <div class="progress-bar" data-progress-bar></div>
          </div>
          <strong data-progress-label>0/0</strong>
        </div>
      </section>

      <section class="form-intro" aria-live="polite">
        <div>
          <p class="eyebrow" data-form-kicker>美容室・サロン / Web</p>
          <h2 data-form-title>Webサイト ヒアリングシート</h2>
          <p data-form-description>
            予約につながる導線と、伝える内容を現状から順に整理します。
          </p>
        </div>
        <span class="answered-chip" data-answered-chip>未入力</span>
      </section>

      <form data-hearing-form novalidate>
        <section class="meta-card" aria-labelledby="meta-title">
          <h3 id="meta-title">基本情報</h3>
          <div class="field-grid">
            <label class="field">
              <span class="field-label">店舗名・院名</span>
              <input type="text" name="storeName" autocomplete="organization" placeholder="例：Salon ○○" />
            </label>
            <label class="field">
              <span class="field-label">ご担当者</span>
              <input type="text" name="contactName" autocomplete="name" placeholder="例：代表 ○○様" />
            </label>
            <label class="field">
              <span class="field-label">ヒアリング日</span>
              <input type="date" name="hearingDate" />
            </label>
            <label class="field">
              <span class="field-label">担当営業</span>
              <select name="salesOwner">
                <option value="">選択してください</option>
                <option>浦田</option>
                <option>渡邉</option>
                <option>その他</option>
              </select>
            </label>
          </div>
        </section>

        <div data-form-sections></div>
      </form>
    </main>

    <div class="actions" aria-label="回答操作">
      <button class="action-button primary" type="button" data-copy>回答まとめをコピー</button>
      <button class="action-button download" type="button" data-download>TXT保存</button>
      <button class="action-button danger" type="button" data-clear>クリア</button>
    </div>

    <p class="toast" role="status" aria-live="polite" data-toast></p>

    <noscript>
      <p class="noscript">このフォームの入力・保存・コピーにはJavaScriptが必要です。</p>
    </noscript>

    <script>
      (() => {
        const form = document.querySelector("[data-hearing-form]");
        const sectionsRoot = document.querySelector("[data-form-sections]");
        const formKicker = document.querySelector("[data-form-kicker]");
        const formTitle = document.querySelector("[data-form-title]");
        const formDescription = document.querySelector("[data-form-description]");
        const saveStatus = document.querySelector("[data-save-status]");
        const progressLabel = document.querySelector("[data-progress-label]");
        const progressBar = document.querySelector("[data-progress-bar]");
        const progressTrack = document.querySelector("[data-progress-track]");
        const answeredChip = document.querySelector("[data-answered-chip]");
        const toast = document.querySelector("[data-toast]");
        const copyButton = document.querySelector("[data-copy]");
        const downloadButton = document.querySelector("[data-download]");
        const clearButton = document.querySelector("[data-clear]");
        const industryButtons = [...document.querySelectorAll("[data-industry-button]")];
        const sheetButtons = [...document.querySelectorAll("[data-sheet-button]")];
        const globalKey = "nosSalonSeitaiHearing:global:v1";
        const storagePrefix = "nosSalonSeitaiHearing:v1";
        let saveTimer = null;
        let toastTimer = null;

        const field = (id, label, type, extra = {}) => ({ id, label, type, ...extra });
        const section = (title, purpose, fields) => ({ title, purpose, fields });

        const configs = {
          beauty: {
            name: "美容室・サロン",
            web: {
              short: "Web",
              title: "Webサイト ヒアリングシート",
              description: "予約につながる導線と、伝える内容を現状から順に整理します。",
              sections: [
                section("目的と今の集客導線", "最初に、増やしたい予約と現在の入口を確認します。", [
                  field("increaseGoals", "一番増やしたいもの", "checks", {
                    options: ["新規予約", "指名予約", "高単価メニュー", "リピーター", "平日予約", "採用", "その他"],
                  }),
                  field("currentRoutes", "今の集客・予約入口", "checks", {
                    options: ["Googleマップ", "Instagram", "LINE", "Hot Pepper等", "Webサイト", "紹介", "電話"],
                  }),
                  field("currentMetrics", "現状と目標の数字", "textarea", {
                    placeholder: "例：新規予約 月8件 → 月15件、客単価8,000円、平日稼働を増やしたい",
                  }),
                  field("trigger", "作り直すきっかけ・一番の課題", "textarea", {
                    placeholder: "例：Instagramは見られるが予約ページまで進まれない。料金が分かりにくいと言われた。",
                  }),
                ]),

            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;");

        const readJson = (key, fallback = {}) => {

            return fallback;

        };

        const fieldMarkup = (item) => {
          const help = item.help ? `<p class="field-help">${escapeHtml(item.help)}</p>` : "";
          const label = `<span class="field-label">${escapeHtml(item.label)}<small>任意</small></span>`;

          if (item.type === "checks") {
            const options = item.options
              .map(
                (option) => `
                  <label class="option">
                    <input type="checkbox" name="${escapeHtml(item.id)}" value="${escapeHtml(option)}" />
                    <span>${escapeHtml(option)}</span>
                  </label>`,
              )
              .join("");
            return `
              <div class="field" data-field-id="${escapeHtml(item.id)}">
                ${label}
                <div class="option-grid">${options}</div>
                ${help}
              </div>`;
          }

          if (item.type === "textarea") {
            return `
              <label class="field" data-field-id="${escapeHtml(item.id)}">
                ${label}
                <textarea name="${escapeHtml(item.id)}" placeholder="${escapeHtml(item.placeholder || "")}"></textarea>
                ${help}
              </label>`;
          }

          if (item.type === "select") {
            const options = item.options
              .map((option) => `<option value="${escapeHtml(option)}">${escapeHtml(option)}</option>`)
              .join("");
            return `
              <label class="field" data-field-id="${escapeHtml(item.id)}">
                ${label}
                <select name="${escapeHtml(item.id)}">
                  ${options}
                </select>
                ${help}
              </label>`;
          }

          return `
            <label class="field" data-field-id="${escapeHtml(item.id)}">
              ${label}
              <input type="text" name="${escapeHtml(item.id)}" placeholder="${escapeHtml(item.placeholder || "")}" />
              ${help}

        };

        const collectValues = () => {
          const config = currentConfig();
          const values = {};
          config.sections.forEach((group) => {
            group.fields.forEach((item) => {
              if (item.type === "checks") {
                values[item.id] = [
                  ...form.querySelectorAll(`input[name="${CSS.escape(item.id)}"]:checked`),
                ].map((input) => input.value);
              } else {
                values[item.id] = form.elements[item.id]?.value?.trim() || "";
              }
            });
          });
          return values;
        };

        const collectMeta = () => ({
          storeName: form.elements.storeName?.value?.trim() || "",
          contactName: form.elements.contactName?.value?.trim() || "",
          hearingDate: form.elements.hearingDate?.value || "",
          salesOwner: form.elements.salesOwner?.value || "",
        });

        const applyValues = (values) => {
          const config = currentConfig();
          config.sections.forEach((group) => {
            group.fields.forEach((item) => {
              const saved = values[item.id];
              if (item.type === "checks") {
                form.querySelectorAll(`input[name="${CSS.escape(item.id)}"]`).forEach((input) => {
                  input.checked = Array.isArray(saved) && saved.includes(input.value);
                });
              } else if (form.elements[item.id]) {
                form.elements[item.id].value = saved || "";
              }
            });
          });
        };

        const applyMeta = (meta) => {
          ["storeName", "contactName", "hearingDate", "salesOwner"].forEach((name) => {
            if (form.elements[name]) form.elements[name].value = meta[name] || "";
          });
        };

        const allFields = () => currentConfig().sections.flatMap((group) => group.fields);

        const isAnswered = (item, values) => {
          const answer = values[item.id];
          return Array.isArray(answer) ? answer.length > 0 : Boolean(answer);
        };

        const updateProgress = () => {
          const values = collectValues();
          const fields = allFields();
          const answered = fields.filter((item) => isAnswered(item, values)).length;
          const total = fields.length;
          const percentage = total ? Math.round((answered / total) * 100) : 0;
          progressLabel.textContent = `${answered}/${total}`;
          progressBar.style.width = `${percentage}%`;
          progressTrack.setAttribute("aria-valuenow", String(percentage));
          answeredChip.textContent = answered ? `${answered}項目 入力済み` : "未入力";
        };

        const save = ({ quiet = false } = {}) => {
          localStorage.setItem(storageKey(), JSON.stringify(collectValues()));
          localStorage.setItem(globalKey, JSON.stringify(collectMeta()));
          updateProgress();
          if (!quiet) {
            saveStatus.textContent = "保存済み";
            clearTimeout(saveTimer);
            saveTimer = setTimeout(() => {
              saveStatus.textContent = "この端末に自動保存";
            }, 1500);
          }
        };

        const updateControls = () => {
          industryButtons.forEach((button) => {
            button.setAttribute(
              "aria-selected",
              String(button.dataset.industryButton === currentIndustry),
            );
          });
          sheetButtons.forEach((button) => {
            button.setAttribute("aria-selected", String(button.dataset.sheetButton === currentSheet));
          });
        };

        const updateUrl = () => {
          const url = new URL(location.href);
          url.searchParams.set("industry", currentIndustry);
          url.searchParams.set("sheet", currentSheet);
          history.replaceState(null, "", url);
        };

        const loadCurrent = ({ scroll = false } = {}) => {
          document.body.dataset.industry = currentIndustry;
          document.querySelector('meta[name="theme-color"]').content =
            currentIndustry === "beauty" ? "#9d5b73" : "#3e7a73";
          const config = currentConfig();
          formKicker.textContent = `${configs[currentIndustry].name} / ${config.short}`;
          formTitle.textContent = config.title;
          formDescription.textContent = config.description;
          updateControls();
          renderSections();
          applyMeta(readJson(globalKey));
          applyValues(readJson(storageKey()));
          updateProgress();
          updateUrl();
          if (scroll) {
            document.querySelector(".form-intro")?.scrollIntoView({ block: "start" });
          }
        };

        const answerText = (item, values) => {
          const answer = values[item.id];
          if (Array.isArray(answer)) return answer.join(" / ");
          return answer || "";
        };

        const buildSummary = () => {
          const config = currentConfig();
          const values = collectValues();
          const meta = collectMeta();
          const lines = [
            `${configs[currentIndustry].name}｜${config.title}`,
            `作成日時: ${new Date().toLocaleString("ja-JP")}`,
            "",
            "【基本情報】",
            `店舗名・院名: ${meta.storeName || "未入力"}`,
            `ご担当者: ${meta.contactName || "未入力"}`,
            `ヒアリング日: ${meta.hearingDate || "未入力"}`,
            `担当営業: ${meta.salesOwner || "未入力"}`,
            "",
          ];

          let hasAnswer = false;
          config.sections.forEach((group) => {
            const groupLines = [];
            group.fields.forEach((item) => {
              const answer = answerText(item, values);
              if (!answer) return;
              hasAnswer = true;
              groupLines.push(`・${item.label}`);
              groupLines.push(answer);
              groupLines.push("");
            });
            if (groupLines.length) {
              lines.push(`【${group.title}】`, ...groupLines);
            }
          });

          if (!hasAnswer) {
            lines.push("ヒアリング回答はまだ入力されていません。");
          }

          lines.push(
            "【次回確認】",
            currentSheet === "ops"
              ? "外部サービス連携は、契約・正式なAPI・CSV出力等を確認後に判断。技術可否と納期は持ち帰って正式回答する。"
              : "正式な構成・費用・納期は、診断とヒアリング内容を確認後に提案する。",
          );

          return lines.join("\n").trim();
        };

        const copyText = async (text) => {
          if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(text);
            return;
          }
          const helper = document.createElement("textarea");
          helper.value = text;
          helper.style.position = "fixed";
          helper.style.opacity = "0";
          document.body.appendChild(helper);
          helper.select();
          document.execCommand("copy");
          helper.remove();
        };

        const downloadText = (text) => {
          const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          const industry = currentIndustry === "beauty" ? "beauty-salon" : "seitai";
          link.href = url;
          link.download = `${industry}-${currentSheet}-hearing-${new Date()
            .toISOString()
            .slice(0, 10)}.txt`;
          document.body.appendChild(link);
          link.click();
          link.remove();
          URL.revokeObjectURL(url);
        };

        industryButtons.forEach((button) => {
          button.addEventListener("click", () => {
            const next = button.dataset.industryButton;
            if (!next || next === currentIndustry) return;
            save({ quiet: true });
            currentIndustry = next;
            loadCurrent({ scroll: true });
          });
        });

        sheetButtons.forEach((button) => {
          button.addEventListener("click", () => {
            const next = button.dataset.sheetButton;
            if (!next || next === currentSheet) return;
            save({ quiet: true });
            currentSheet = next;
            loadCurrent({ scroll: true });
          });
        });

        form.addEventListener("input", () => save());
        form.addEventListener("change", () => save());

        copyButton.addEventListener("click", async () => {
          save({ quiet: true });
          try {
            await copyText(buildSummary());
            showToast("回答まとめをコピーしました");
          } catch {
            showToast("コピーできませんでした。TXT保存をお試しください。");
          }
        });

        downloadButton.addEventListener("click", () => {
          save({ quiet: true });
          downloadText(buildSummary());
          showToast("回答TXTを保存しました");
        });

        clearButton.addEventListener("click", () => {
          const label = `${configs[currentIndustry].name} / ${currentConfig().title}`;
          if (!window.confirm(`${label} の入力だけを消します。よろしいですか？`)) return;
          localStorage.removeItem(storageKey());
          renderSections();
          applyMeta(readJson(globalKey));
          updateProgress();
          showToast("このシートの入力をクリアしました");
        });

        loadCurrent();
      })();
    </script>
  </body>
</html>
